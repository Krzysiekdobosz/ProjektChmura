# Backend Ingress - bez rewrite-target, aby Laravel zachowal prefiksy /api/, /placeholders/, /storage/
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-ingress
  namespace: najmuj-mieszkanie
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: najmuj.local
      http:
        paths:
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 80
          - path: /placeholders/
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 80
          - path: /storage/
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 80
---
# Frontend Ingress - obsluguje pozostale sciezki (Vue Router)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
  namespace: najmuj-mieszkanie
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: najmuj.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
